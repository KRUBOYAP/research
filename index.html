<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์และประเมินข้อเสนอโครงงานคอมพิวเตอร์</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #ca8a04;
        }
        body { font-family: 'Sarabun', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1, h2, h3 { margin-top: 0; color: #0f172a; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        textarea { resize: vertical; min-height: 70px; }
        button { width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        button:hover { opacity: 0.9; }
        .score-box { text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #eff6ff; }
        .score-number { font-size: 3rem; font-weight: 800; color: var(--primary); }
        .verdict { font-size: 1.4rem; font-weight: bold; margin-top: 8px; }
        .approved { color: var(--success); }
        .needs-improvement { color: var(--warning); }
        .feedback-item { margin-bottom: 12px; padding: 10px; border-left: 4px solid var(--primary); background: #f1f5f9; font-size: 0.88rem; }
    </style>
</head>
<body>

<div class="container">
    <!-- ฟอร์มกรอกข้อมูลโครงงาน -->
    <div class="card">
        <h2>แบบเสนอโครงงานคอมพิวเตอร์</h2>
        <form id="proposalForm">
            <div class="form-group">
                <label>1. ชื่อโครงงาน</label>
                <input type="text" id="title" placeholder="ระบุชื่อโครงงาน...">
            </div>
            <div class="form-group">
                <label>2. ประเภทโครงงาน</label>
                <input type="text" id="type" placeholder="เช่น การพัฒนาระบบซอฟต์แวร์ / สื่อการเรียนรู้">
            </div>
            <div class="form-group">
                <label>3. ผู้จัดทำโครงงาน (ใส่เครื่องหมาย , คั่นชื่อ)</label>
                <input type="text" id="authors" placeholder="ชื่อคนที่ 1, ชื่อคนที่ 2">
            </div>
            <div class="form-group">
                <label>4-5. ครูที่ปรึกษา / ครูที่ปรึกษาร่วม</label>
                <input type="text" id="advisors" placeholder="ชื่อครูที่ปรึกษา">
            </div>
            <div class="form-group">
                <label>6. ระยะเวลาดำเนินงาน</label>
                <input type="text" id="duration" placeholder="เช่น 1 พฤศจิกายน 2568 - 31 มีนาคม 2569">
            </div>
            <div class="form-group">
                <label>7. แนวคิด ที่มา และความสำคัญ</label>
                <textarea id="rationale" placeholder="อธิบายปัญหา ความจำเป็น และแนวคิดการแก้ปัญหา..."></textarea>
            </div>
            <div class="form-group">
                <label>8. วัตถุประสงค์ (ระบุเป็นข้อๆ)</label>
                <textarea id="objectives" placeholder="1) เพื่อพัฒนา...&#10;2) เพื่อทดสอบ..."></textarea>
            </div>
            <div class="form-group">
                <label>9. หลักการและทฤษฎี</label>
                <textarea id="theory" placeholder="ระบุเทคโนโลยี ภาษา หรือทฤษฎีที่เกี่ยวข้อง..."></textarea>
            </div>
            <div class="form-group">
                <label>10-11. วิธีดำเนินงาน และ ขั้นตอนการปฏิบัติ</label>
                <textarea id="methodology" placeholder="ระบุขั้นตอนการทำงาน วัสดุอุปกรณ์ งบประมาณ และตารางเวลา..."></textarea>
            </div>
            <div class="form-group">
                <label>12. ผลที่คาดว่าจะได้รับ</label>
                <textarea id="expectedResults" placeholder="1) ได้แอปพลิเคชัน...&#10;2) ผู้ใช้มีความพึงพอใจ..."></textarea>
            </div>
            <div class="form-group">
                <label>13. เอกสารอ้างอิง</label>
                <textarea id="references" placeholder="1) ชื่อผู้แต่ง. (ปี). ชื่อหนังสือ/บทความ..."></textarea>
            </div>
            <button type="button" onclick="evaluateProposal()">วิเคราะห์และประเมินผล</button>
        </form>
    </div>

    <!-- ส่วนแสดงผลการวิเคราะห์และคะแนน -->
    <div class="card">
        <h2>ผลการวิเคราะห์และประเมิน</h2>
        <div class="score-box">
            <div>คะแนนรวมที่ได้</div>
            <div class="score-number" id="totalScore">0 / 100</div>
            <div class="verdict" id="verdictStatus">รอการประเมิน</div>
        </div>

        <h3>ข้อเสนอแนะรายข้อ</h3>
        <div id="feedbackList">
            <p style="color: #64748b;">กรอกข้อมูลโครงงานและกดปุ่ม "วิเคราะห์และประเมินผล" เพื่อดูรายงาน</p>
        </div>
    </div>
</div>

<script>
function evaluateProposal() {
    let score = 0;
    let feedback = [];

    // Extract Values
    const title = document.getElementById('title').value.trim();
    const type = document.getElementById('type').value.trim();
    const authors = document.getElementById('authors').value.trim();
    const advisors = document.getElementById('advisors').value.trim();
    const duration = document.getElementById('duration').value.trim();
    const rationale = document.getElementById('rationale').value.trim();
    const objectives = document.getElementById('objectives').value.trim();
    const theory = document.getElementById('theory').value.trim();
    const methodology = document.getElementById('methodology').value.trim();
    const results = document.getElementById('expectedResults').value.trim();
    const references = document.getElementById('references').value.trim();

    // 1. General Info Evaluation (10 pts)
    let infoScore = 0;
    if (title) infoScore += 2;
    if (type) infoScore += 2;
    if (authors) infoScore += 2;
    if (advisors) infoScore += 2;
    if (duration) infoScore += 2;
    score += infoScore;
    feedback.push({ section: "ข้อมูลทั่วไป (ข้อ 1-6)", score: infoScore, max: 10, note: infoScore === 10 ? "ครบถ้วนสมบูรณ์" : "ควรระบุข้อมูลพื้นฐาน ผู้จัดทำ ครูที่ปรึกษา และระยะเวลาให้ครบถ้วน" });

    // 2. Rationale & Objectives (35 pts)
    let rationaleScore = 0;
    if (rationale.length > 100) rationaleScore += 15;
    else if (rationale.length > 30) rationaleScore += 8;

    let objScore = 0;
    if (objectives.includes("1)") || objectives.includes("1.")) objScore += 20;
    else if (objectives.length > 20) objScore += 10;

    const bgScore = rationaleScore + objScore;
    score += bgScore;
    feedback.push({ 
        section: "ความสำคัญและวัตถุประสงค์ (ข้อ 7-8)", 
        score: bgScore, 
        max: 35, 
        note: `ที่มาและความสำคัญ ${rationaleScore}/15, วัตถุประสงค์ ${objScore}/20. ` + (objScore < 20 ? "แนะนำให้เขียนวัตถุประสงค์แยกเป็นข้อๆ ชัดเจน (เช่น 1), 2))" : "วัตถุประสงค์จัดโครงสร้างได้ดี")
    });

    // 3. Theory & Methodology (35 pts)
    let theoryScore = theory.length > 50 ? 15 : (theory.length > 10 ? 8 : 0);
    let methodScore = methodology.length > 80 ? 20 : (methodology.length > 20 ? 10 : 0);
    const techScore = theoryScore + methodScore;
    score += techScore;
    feedback.push({
        section: "ทฤษฎีและวิธีดำเนินงาน (ข้อ 9-11)",
        score: techScore,
        max: 35,
        note: `หลักการทฤษฎี ${theoryScore}/15, วิธีดำเนินงาน ${methodScore}/20. ` + (methodScore < 20 ? "ควรเพิ่มรายละเอียดขั้นตอนการพัฒนาระบบ อุปกรณ์ งบประมาณ และตารางเวลาปฏิบัติงาน" : "รายละเอียดครอบคลุม")
    });

    // 4. Expected Results & References (20 pts)
    let resScore = results.length > 30 ? 10 : (results.length > 5 ? 5 : 0);
    let refScore = (references.includes("http") || references.length > 30) ? 10 : (references.length > 5 ? 5 : 0);
    const outScore = resScore + refScore;
    score += outScore;
    feedback.push({
        section: "ผลที่คาดว่าจะได้รับและเอกสารอ้างอิง (ข้อ 12-13)",
        score: outScore,
        max: 20,
        note: `ผลที่คาดว่าจะได้รับ ${resScore}/10, เอกสารอ้างอิง ${refScore}/10. ` + (refScore < 10 ? "ควรเพิ่มการอ้างอิงหนังสือ วารสาร หรือแหล่งข้อมูลออนไลน์ให้เป็นรูปแบบมาตรฐาน" : "ระบุแหล่งอ้างอิงชัดเจน")
    });

    // Display Output
    document.getElementById('totalScore').innerText = `${score} / 100`;
    const verdictEl = document.getElementById('verdictStatus');
    
    if (score >= 60) {
        verdictEl.innerText = "ผลการพิจารณา: อนุมัติ";
        verdictEl.className = "verdict approved";
    } else {
        verdictEl.innerText = "ผลการพิจารณา: ควรปรับปรุง";
        verdictEl.className = "verdict needs-improvement";
    }

    // Render Feedback
    const feedbackList = document.getElementById('feedbackList');
    feedbackList.innerHTML = feedback.map(item => `
        <div class="feedback-item">
            <strong>${item.section}</strong> — <span>${item.score}/${item.max} คะแนน</span>
            <div>${item.note}</div>
        </div>
    `).join('');
}
</script>
</body>
</html>
